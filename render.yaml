services:
  # ── Backend (FastAPI on Render) ──────────────────────────────────────────────
  - type: web
    name: energy-diagnostics-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: CORS_ORIGINS
        value: "*"
      - key: MONGO_URI
        sync: false           # set in Render dashboard — do NOT commit
      - key: JWT_SECRET
        sync: false           # set in Render dashboard — do NOT commit
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false           # e.g. https://energy-diagnostics.vercel.app
      - key: WEATHER_API_KEY
        value: ""             # optional — leave blank to skip
    disk:
      name: pipeline-cache
      mountPath: /opt/render/project/src/backend/data/cache
      sizeGB: 1
