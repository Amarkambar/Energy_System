name: CI — Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: Python tests + security scan ─────────────────────────────────
  backend-test:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx joblib

      - name: Run pytest unit tests
        env:
          PYTHONIOENCODING: utf-8
          MONGO_URI: ""          # empty — tests use in-memory mocks
          JWT_SECRET: test-secret-key-for-ci
          CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
        run: pytest tests/ -v --tb=short

      - name: Bandit security scan
        run: |
          pip install bandit -q
          bandit -r api.py config.py data/pipeline.py models/ml_models.py \
            alerts/alerts_engine.py -ll -f txt

      - name: Python dependency audit
        run: |
          pip install pip-audit -q
          pip-audit -r requirements.txt

      - name: Check syntax (all Python files)
        run: |
          find . -name "*.py" ! -path "./venv/*" | \
            xargs python -m py_compile && echo "All files OK"

  # ── Frontend: build + audit ───────────────────────────────────────────────
  frontend-build:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm test -- --run

      - name: Build production bundle
        env:
          VITE_API_URL: https://placeholder.onrender.com
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high
