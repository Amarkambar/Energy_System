<html lang="en">

<head>

  <!-- Prevent browser / proxy caching of the app shell -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- App Title -->
  <title>Energy System</title>

  <!-- App Description -->
  <meta name="description" content="Energy System – smart energy system" />
  <meta name="author" content="Amar Kambar" />

  <meta property="og:title" content="Energy System" />
  <meta property="og:description" content="Analyze energy system" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/energy_dia.png" />

  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:description" content="Smart energy diagnostics and analytics dashboard" />
  <meta name="twitter:image" content="/energy_dia.png" />

  <!-- Favicons (from favicon.io) -->

  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
</head>

  <!-- React entry point -->
